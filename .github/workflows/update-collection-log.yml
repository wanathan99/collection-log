name: Update collection log data

on:
  schedule:
    - cron: "0 6 * * 4" # every Thursday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Scrape collection log table
        run: python3 scripts/scrape.py

      - name: Commit changes if any
        run: |
          if git diff --quiet -- data/items.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git commit -m "Update collection log data from OSRS Wiki"
          git push
